[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-lang"
version = "0.1.0"
description = "A systems language with no natural-language keywords, compiled straight to machine code"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ben" }]
keywords = ["compiler", "programming-language", "x86-64", "elf", "systems"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/hanos1987/vibe"
Documentation = "https://github.com/hanos1987/vibe/blob/master/SPEC.md"

[project.scripts]
vibec = "vibelang.cli:main"

[tool.setuptools]
packages = ["vibelang"]

[tool.setuptools.package-data]
vibelang = ["stdlib/*.vibe"]
